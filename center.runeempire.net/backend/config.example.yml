# RuneEmpire Center backend configuration (replaces .env).
#
# Copy this file to config.yml and fill it in; config.yml is not committed.
# Nested keys become environment variables for the config/ files:
# db.global.host -> DB_GLOBAL_HOST, password.argon2.memory-kib -> PASSWORD_ARGON2_MEMORY_KIB.
# A real environment variable with the same name overrides the value here.

app:
  name: RuneEmpire Center
  env: local          # local | production
  debug: true         # always false in production
  url: http://localhost:8000
  # Generate with: php artisan key:generate --show
  key: ""

redis:
  host: 127.0.0.1
  port: 6379
  password: ""
  # Only sessions use this index. The Redis instance is shared (Pterodactyl,
  # LuckPerms, ...): pick an index nothing else uses, and never share it with
  # a cache store (cache:clear flushes the whole index).
  db: 3

session:
  driver: redis
  lifetime: 120         # minutes of inactivity before the login expires
  # Production: set true. Unset (as in dev) means automatic, which marks the
  # cookie Secure only when the request is seen as HTTPS through a correctly
  # trusted proxy; a wrong trusted-proxies value would silently drop it.
  # Never false in production.
  # secure-cookie: true

sanctum:
  # Website origins that get session login and CSRF protection.
  stateful-domains:
    - localhost:5173
    # production: center.runeempire.net

# Proxies whose X-Forwarded-For / -Proto is trusted (Cloudflare Tunnel's cloudflared).
# If the backend runs in Docker, this is the bridge gateway (e.g. 172.18.0.1), not 127.0.0.1.
trusted-proxies:
  - 127.0.0.1

db:
  # Laravel's own tables (cache, API tokens) until the web database exists.
  connection: sqlite

  # Shared network database; the accounts table belongs to the PAxAuth plugin.
  global:
    driver: mysql
    host: 127.0.0.1
    port: 3306
    database: global
    username: root
    password: ""

queue:
  # No background jobs yet; run them inline.
  connection: sync

password:
  # Must produce the same hashes PAxAuth verifies (argon2id).
  argon2:
    iterations: 3
    memory-kib: 131072
    parallelism: 4
  min-length: 8
  # Must not exceed PAxAuth's password.max-length, or the player cannot log in in-game.
  max-length: 64

mail:
  mailer: smtp
  host: smtp-relay.brevo.com
  port: 587
  username: ""          # Brevo SMTP login (Resend: "resend")
  password: ""          # Brevo SMTP key (Resend: API key; host smtp.resend.com)
  from:
    address: no-reply@mail.runeempire.net
    name: RuneEmpire

registration:
  code:
    length: 6           # digits, 4-12
    expires-minutes: 15
    max-attempts: 5     # 1-255

rate-limits:
  register:             # POST /api/auth/register, per IP
    per-minute: 5
    per-hour: 20
  register-verify:      # POST /api/auth/register/verify, per IP
    per-minute: 10
  registration-mail:    # one code per email address within this window
    cooldown-seconds: 60
  login:                # POST /api/auth/login
    per-minute: 5       # per username + IP
    per-minute-per-ip: 20
  password-change:      # PUT /api/auth/password, per account
    per-minute: 5

cors:
  # Origins of the React frontend allowed to call the API.
  allowed-origins:
    - http://localhost:5173
